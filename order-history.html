    <link rel="stylesheet" href="style.css">

</head>
<body>
        <!-- HEADER  -->
      <header class="header">
          <img  src="palace.png" alt="savory's Palace">
          <div class="navMenu" id="navMenu">
          <i class="bx bx-window-close" onclick="closeMenu()"></i>    
        <ul>
           <li> <a href="index.html">Home </a> </li>

    <!-- ORDER HISTORY SECTION -->
    <section class="order-history-section">

        <div class="order-history-container">

            <div class="order-history-heading">

                <h1>My Order History</h1>

                <p>
                    View your previous orders at Savory Palace.
                </p>

            </div>


            <!-- ORDER HISTORY WILL APPEAR HERE -->
            <div id="orderHistory">

                <p>Loading your orders...</p>

            </div>


            <!-- CLEAR HISTORY BUTTON -->
           <div class="order-history-actions">
                <button type="button" id="clearHistory" class="btn">
                <i class="bx bx-trash"></i>
                Clear Order History
            </button>


            <!-- BACK TO MENU -->
            <a href="menu.html" class="btn">
                <i class="bx bx-restaurant"></i>
                Order More Food
            </a>
            
           </div>
