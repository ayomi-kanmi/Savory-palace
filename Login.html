<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login | Savory Palace</title>

<!-- Google Font -->
   <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
<!-- Boxicons -->
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

<style>
    :root {
        --bg-color: #FFF8E7;
        --text-color: #3B2416;
        --primary: #8B4513;
        --accent: #F4C95D;
        --border-color: #E5D5B8;
        --btn-bg: #8B4513;
        --btn-text: #FFFFFF;
        --btn-hover: #66300D;
        --shadow: 0 8px 25px rgba(59, 36, 22, 0.12);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Poppins', sans-serif;
        background: var(--bg-color);
        color: var(--text-color);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .login-container {
        background: #FFFFFF;
        width: 100%;
        max-width: 430px;
        padding: 35px;
        border-radius: 15px;
        box-shadow: var(--shadow);
    }

    .logo {
        text-align: center;
        margin-bottom: 25px;
    }

    .logo i {
        font-size: 50px;
        color: var(--primary);
    }

    .logo h1 {
        color: var(--primary);
        font-size: 27px;
        font-family: 'Playfair Display' , serif;
    }

    .logo p {
        font-size: 13px;
        margin-top: 5px;
        color: #777;
    }

    .login-container h2 {
        text-align: center;
        margin-bottom: 8px;
        font-family: 'Playfair Display' , serif;
    }

    .welcome-text {
        text-align: center;
        font-size: 14px;
        margin-bottom: 25px;
        color: #777;
        font-family: 'poppins' ,sans- serif;
    }

    .input-group {
        margin-bottom: 18px;
    }

    .input-group label {
        display: block;
        margin-bottom: 7px;
        font-size: 14px;
        font-weight: 500;
    }

    .input-box {
        display: flex;
        align-items: center;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0 12px;
    }

    .input-box:focus-within {
        border-color: var(--primary);
    }

    .input-box i {
        font-size: 21px;
        color: var(--primary);
    }

    .input-box input {
        width: 100%;
        padding: 13px 10px;
        border: none;
        outline: none;
        font-family: inherit;
        font-size: 14px;
        background: transparent;
    }

    .toggle-password {
        cursor: pointer;
        border: none;
        background: transparent;
        display: flex;
        align-items: center;
    }

    .form-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        margin-bottom: 22px;
    }

    .remember-me {
        display: flex;
        align-items: center;
        gap: 5px;
    }

    a {
        color: var(--primary);
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }

    .login-btn {
        width: 100%;
        padding: 13px;
        background: var(--btn-bg);
        color: var(--btn-text);
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: 0.3s;
    }

    .login-btn:hover {
        background: var(--btn-hover);
    }

    .message {
        font-size: 13px;
        margin-top: 15px;
        text-align: center;
    }

    .register-link {
        text-align: center;
        margin-top: 22px;
        font-size: 13px;
    }

    .back-home {
        display: block;
        text-align: center;
        margin-top: 20px;
        font-size: 13px;
    }

    @media (max-width: 480px) {
        .login-container {
            padding: 25px 20px;
        }

        .logo h1 {
            font-size: 24px;
        }
    }
</style>

</head>
<body>
    <div class="login-container">

    <div class="logo">
        <i class='bx bx-restaurant'></i>
        <h1>Savory Palace</h1>
        <p>Delicious meals, delightful moments.</p>
    </div>

    <h2>Welcome Back!</h2>
    <p class="welcome-text">Login to continue to your account.</p>

    <form id="loginForm">

        <div class="input-group">
            <label for="email">Email Address</label>

            <div class="input-box">
                <i class='bx bx-envelope'></i>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>              
            </div>
        </div>

        <div class="input-group">
            <label for="password">Password</label>

            <div class="input-box">
                <i class='bx bx-lock-alt'></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>
                

                <button
                    type="button"
                    id="togglePassword"
                    class="toggle-password"
                    aria-label="Show password">
                
                    <i class='bx bx-show'></i>
                </button>
            </div>
        </div>

        <div class="form-options">
            <label class="remember-me">
                <input type="checkbox" id="rememberMe">
                Remember me
            </label>

            <a href="forgot-password.html">Forgot password?</a>
        </div>

        <button type="submit" class="login-btn">Login</button>

        <p id="loginMessage" class="message" role="status" aria-live="polite"></p>

    </form>

    <p class="register-link">
        Don't have an account?
        <a href="register.html">Create Account</a>
    </p>

    <a href="index.html" class="back-home">
        <i class='bx bx-arrow-back'></i> Back to Home
    </a>

</div>

<script src="Login.js"></script>

</body>
</html>
